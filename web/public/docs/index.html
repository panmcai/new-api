<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>使用文档</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            color: white;
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .docs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .doc-card {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .doc-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .doc-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #667eea;
        }

        .doc-card h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #333;
        }

        .doc-card p {
            color: #666;
            margin-bottom: 1.5rem;
        }

        .doc-link {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 500;
            transition: background 0.3s ease;
        }

        .doc-link:hover {
            background: #5a67d8;
        }

        .api-info {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 2rem;
            margin-top: 2rem;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .api-info h2 {
            color: #333;
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .info-item {
            background: white;
            padding: 1.5rem;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .info-item h3 {
            color: #667eea;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }

        .info-item p {
            color: #666;
            font-family: monospace;
            background: #f7f7f7;
            padding: 0.5rem;
            border-radius: 5px;
            word-break: break-all;
        }

        .footer {
            text-align: center;
            margin-top: 3rem;
            color: white;
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .header h1 {
                font-size: 2rem;
            }

            .docs-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>使用文档</h1>
            <p>https://api.peterpanai.com · OpenAI 兼容 /v1</p>
        </div>

        <div class="docs-grid">
            <a href="/docs/usage-zh" class="doc-card">
                <div class="doc-icon">📖</div>
                <h2>使用文档（中文）</h2>
                <p>令牌、curl、Python、Cursor 基址一行说明。</p>
                <span class="doc-link">打开 →</span>
            </a>

            <a href="/docs/usage-en" class="doc-card">
                <div class="doc-icon">🌐</div>
                <h2>Usage (EN)</h2>
                <p>Token, curl, Python, IDE base URL.</p>
                <span class="doc-link">Open →</span>
            </a>

            <a href="/docs/quick" class="doc-card">
                <div class="doc-icon">🚀</div>
                <h2>快速入门</h2>
                <p>健康检查 + 一条 chat 测试命令。</p>
                <span class="doc-link">打开 →</span>
            </a>
        </div>

        <div class="footer">
            <p>© <span id="docs-copyright-year"></span></p>
        </div>
    </div>
    <script>
        (function () {
            var el = document.getElementById('docs-copyright-year');
            if (el) el.textContent = String(new Date().getFullYear());
        })();
    </script>
</body>

</html>
